name: Create TeddyBench Linux release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Linux branch
        uses: actions/checkout@v4
        with:
          ref: linux-1.7.0

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick zip

      - name: Download existing Linux application
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p download
          gh release download v1.7.0-linux.1 --repo "$GITHUB_REPOSITORY" --pattern 'TeddyBench-Linux-1.7.0-linux.1.tar.xz' --dir download

      - name: Prepare installer test package
        run: |
          set -euo pipefail
          test -f packaging/install-linux.sh
          test -f packaging/uninstall-linux.sh
          test -f packaging/teddybench.desktop
          test -f TeddyBench/dog.ico
          mkdir -p package/TeddyBench-Linux
          tar -xf download/TeddyBench-Linux-1.7.0-linux.1.tar.xz -C package/TeddyBench-Linux --strip-components=1
          test -s package/TeddyBench-Linux/TeddyBench
          test -s package/TeddyBench-Linux/TeddyBench.exe
          cp packaging/install-linux.sh packaging/uninstall-linux.sh packaging/teddybench.desktop packaging/README.md package/TeddyBench-Linux/
          cp TeddyBench/dog.ico package/TeddyBench-Linux/
          convert 'TeddyBench/dog.ico[0]' package/TeddyBench-Linux/teddybench.png
          test -s package/TeddyBench-Linux/teddybench.png
          chmod +x package/TeddyBench-Linux/TeddyBench package/TeddyBench-Linux/install-linux.sh package/TeddyBench-Linux/uninstall-linux.sh
          bash -n package/TeddyBench-Linux/install-linux.sh
          bash -n package/TeddyBench-Linux/uninstall-linux.sh
          printf '\nInstaller test only. Application binary reused from v1.7.0-linux.1; later UI commits are not included. Install from the extracted download directory, never from /opt/teddybench itself.\n' >> package/TeddyBench-Linux/README.md

      - name: Archive test package
        run: |
          set -euo pipefail
          cd package
          zip -r ../TeddyBench-Linux-installer-test.zip TeddyBench-Linux
          cd ..
          sha256sum TeddyBench-Linux-installer-test.zip > TeddyBench-Linux-installer-test.zip.sha256

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeddyBench-Linux-installer-test
          path: |
            TeddyBench-Linux-installer-test.zip
            TeddyBench-Linux-installer-test.zip.sha256
          if-no-files-found: error
