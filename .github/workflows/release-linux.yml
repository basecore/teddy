name: Release TeddyBench Linux

on:
  push:
    branches: [linux-1.7.0]
    paths: [.github/workflows/release-linux.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: teddybench-linux-first-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'basecore/teddy' && github.ref == 'refs/heads/linux-1.7.0'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TAG: v1.7.0-linux.1
      ARCHIVE: TeddyBench-Linux-1.7.0-linux.1.tar.xz
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse to overwrite an existing release
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 -c 'import json, os, sys; releases=json.load(open(sys.argv[1])); sys.exit("Release tag already exists; refusing to overwrite") if any(r["tag_name"] == os.environ["TAG"] for r in releases) else None' "$RUNNER_TEMP/releases.json"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Select installed .NET 8 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK=$(dotnet --list-sdks | awk '$1 ~ /^8\./ {print $1}' | sort -V | tail -1)
          test -n "$SDK"
          printf '{"sdk":{"version":"%s","rollForward":"disable"}}\n' "$SDK" > global.json
          dotnet --version
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils
      - name: Restore and build with persistent logs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-log
          dotnet restore Teddy.sln 2>&1 | tee build-log/restore.log
          dotnet build Teddy.sln -c Release -p:Platform="Any CPU" --no-restore -bl:build-log/build.binlog 2>&1 | tee build-log/build.log
      - name: Package complete application output
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT=TeddyBench/bin/Release/net48
          test -s "$OUTPUT/TeddyBench.exe"
          mkdir -p dist/TeddyBench-Linux
          cp -a "$OUTPUT/." dist/TeddyBench-Linux/
          install -m 755 Linux/TeddyBench dist/TeddyBench-Linux/TeddyBench
          cp README.md Linux/RELEASE_NOTES.md dist/TeddyBench-Linux/
          tar -cJf "$ARCHIVE" -C dist TeddyBench-Linux
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          sha256sum -c "$ARCHIVE.sha256"
          tar -tf "$ARCHIVE"
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeddyBench-Linux-1.7.0-linux.1
          path: |
            TeddyBench-Linux-1.7.0-linux.1.tar.xz
            TeddyBench-Linux-1.7.0-linux.1.tar.xz.sha256
          if-no-files-found: error
      - name: Publish public prerelease
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "TeddyBench v1.7.0-linux.1 - Linux Mint preview" --notes-file Linux/RELEASE_NOTES.md --prerelease
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teddybench-linux-release-build-logs
          path: build-log/
          if-no-files-found: ignore
