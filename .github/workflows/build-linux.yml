name: Build TeddyBench for Linux

on:
  push:
    branches:
      - linux-1.7.0
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdiplus ffmpeg

      - name: Restore solution
        run: dotnet restore Teddy.sln

      - name: Build solution
        run: dotnet build Teddy.sln -c Release -p:Platform="Any CPU" --no-restore

      - name: Collect build output
        if: always()
        run: |
          mkdir -p build-log
          find . -type f \( -name '*.log' -o -name '*.binlog' \) -exec cp {} build-log/ \; || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teddybench-linux-build-logs
          path: build-log/
