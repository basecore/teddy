name: Build TeddyBench for Linux

on:
  push:
    branches:
      - linux-1.7.0
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdiplus ffmpeg xz-utils

      - name: Restore solution
        run: dotnet restore Teddy.sln

      - name: Build solution
        run: dotnet build Teddy.sln -c Release -p:Platform="Any CPU" --no-restore

      - name: Collect Linux runtime files
        run: |
          mkdir -p dist/TeddyBench-Linux
          find TeddyBench/bin/Release/net48 -maxdepth 1 -type f \
            \( -name 'TeddyBench.exe' \
            -o -name '*.dll' \
            -o -name '*.config' \
            -o -name '*.exe.config' \) \
            -exec cp {} dist/TeddyBench-Linux/ \;
          cp Linux/TeddyBench dist/TeddyBench-Linux/
          chmod +x dist/TeddyBench-Linux/TeddyBench

      - name: Create Linux archive
        run: |
          tar -cJf TeddyBench-Linux-1.7.0.tar.xz -C dist TeddyBench-Linux
          ls -lh TeddyBench-Linux-1.7.0.tar.xz

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: TeddyBench-Linux-1.7.0
          path: TeddyBench-Linux-1.7.0.tar.xz

      - name: Collect build output
        if: failure()
        run: |
          mkdir -p build-log
          find . -type f \( -name '*.log' -o -name '*.binlog' \) -exec cp {} build-log/ \; || true

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: teddybench-linux-build-logs
          path: build-log/
