name: Build TeddyBench for Linux

on:
  push:
    branches:
      - linux-1.7.0
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Mono and Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mono-complete \
            mono-devel \
            mono-xbuild \
            libgdiplus \
            ffmpeg \
            git

      - name: Show tool versions
        run: |
          mono --version
          xbuild -version || true

      - name: Build with Mono xbuild
        run: |
          xbuild Teddy.sln \
            /p:Configuration=Release \
            /p:Platform="Any CPU"

      - name: Collect build output
        if: always()
        run: |
          mkdir -p build-log
          find . -type f \( -name '*.log' -o -name '*.binlog' \) -exec cp {} build-log/ \; || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teddybench-linux-build-logs
          path: build-log/
